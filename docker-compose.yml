services:
  evaluator:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
      - hf_cache:/root/.cache/huggingface
    environment:
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
      - hf_cache:/root/.cache/huggingface

volumes:
  qdrant_storage:
  hf_cache: